name: clang-tidy

on:
  workflow_dispatch:

  pull_request:
    branches: [main]
    paths: ['**.c', '**.cpp', '**.h', '**.hpp', '**.cxx', '**.hxx', '**.cc', '**.hh', '**CMakeLists.txt', '**.cmake']

jobs:
  lint:
    runs-on: windows

    # Set required permissions if using thread comments or PR reviews
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Configure CMake
        # -DCMAKE_EXPORT_COMPILE_COMMANDS=ON tells CMake to create compile_commands.json
        run: cmake -B build -S . -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        uses: cpp-linter/cpp-linter-action@v2
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          style: ''  # Uses the .clang-format file in your repository
          # Point the action to the database generated by CMake in the 'build' folder
          database: 'build' 
          thread-comments: true

      - name: Fail workflow if checks failed
        if: steps.linter.outputs.checks-failed != 0
        run: |
          echo "Linter detected clang-tidy errors."
          exit 1